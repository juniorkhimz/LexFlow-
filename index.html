<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="LexFlow is a legal practice management platform for law firms — leads, clients, matters, billing, documents, and a client portal in one place." />
    <meta property="og:title" content="LexFlow — Legal Practice Management" />
    <meta property="og:description" content="Leads, clients, matters, billing, documents, and a client portal — built for law firms." />
    <meta property="og:type" content="website" />
    <!-- No og:image yet — add one (public/og-image.png, ~1200×630) once
         there's real brand artwork; an OG tag pointing at a missing file
         is worse than no tag at all. -->
    <title>LexFlow — Legal Practice Management</title>
    <script>
      // Runs before paint, before React loads, so a dark-mode user never
      // sees a flash of the light theme (and vice versa). Mirrors the same
      // logic as getInitialTheme() in src/lib/theme.tsx — keep both in sync.
      (function () {
        try {
          var stored = localStorage.getItem("lexflow-theme");
          var isDark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
